# Проверка подключения redis docker exec -it flowers_ct redis-cli -a пароль ping
# Проверка логово docker logs flowers_ct

services:
  db:
    container_name: db_container
    image: postgres:15
    env_file:
      - .env
    networks:
      - flowers_nt
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    # порт хоста:порт внутри контейнера
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  dj:
    container_name: dj_container
    build: .
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowers_nt
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
    volumes:
      # статика вне контейнера, для того, чтобы nginx отдавал ее быстро с хоста
      # соответствует STATIC_ROOT и MEDIA_ROOT
      - /var/www/flowershop/staticfiles:/app/staticfiles
      - /var/www/flowershop/media:/app/media
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py createsuperuser --noinput 2>/dev/null || true &&
      gunicorn flower_shop.wsgi:application 
      --bind 0.0.0.0:8002
      --workers 2
      --threads 2
      --worker-class gthread
      --timeout 120
      --max-requests 1000"

  redis:
    image: redis:alpine
    container_name: redis_container
    env_file:
      - .env
    ports:
      - "6379:6379"
    networks:
      - flowers_nt
    restart: always
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    profiles: ["monitoring"] # флаг чтобы контейнер автоматически не поднимался
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
    networks:
      - flowers_nt

  loki:
    image: grafana/loki:latest
    container_name: loki
    profiles: ["monitoring"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - flowers_nt

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    networks:
      - flowers_nt

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafanadata:/var/lib/grafana
    networks:
      - flowers_nt


volumes:
  redis_data:
  db_data:
  grafanadata:
  prometheusdata:

networks:
  flowers_nt:
    name: flowers_nt
    driver: bridge
    