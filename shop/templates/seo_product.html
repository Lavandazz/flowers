{% block og_tags %}
    <meta property="og:type" content="product">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ product.name }}. Свежие цветы с доставкой. Смотрите букет на сайте.">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:site_name" content="Флористка">
    <meta property="og:image" content="{% block og_image %}{% static '1.jpg' %}{% endblock %}">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
{% endblock %}
