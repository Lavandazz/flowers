{#  Боковая панель   Категории товаров  #}

{% block catalogue_aside %}
    <aside class="catalog-sidebar">
        <h3>Категории</h3>
        <ul class="category-list">
            {% for category in categories %}
                <li class="category-item" {{ category }}>
                    <a href="{{ category.get_absolute_url }}">
                        {{ category.name }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </aside>
{% endblock %}
